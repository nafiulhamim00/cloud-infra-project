name: Cleanup test tag

on:
  workflow_dispatch: {}

jobs:
  delete-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Delete nafiulhamim/demo-app:token-test
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -s -X DELETE -H "Authorization: JWT ${JWT}" \
            https://hub.docker.com/v2/repositories/nafiulhamim/demo-app/tags/token-test/
