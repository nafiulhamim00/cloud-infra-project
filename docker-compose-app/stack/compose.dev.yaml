services:
  app:
    ports:
      - "8088:8080" # Direct access to the app, bypassing nginx

  database:
    ports:
      - "3306:3306"

  cache:
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - app-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:cache:6379
    networks:
      - app-network
